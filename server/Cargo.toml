[workspace]
members = [
    "crates/boxkv-core",
    "crates/boxkv-wasm",
    "crates/boxkv-storage",
    "crates/boxkv-common",
    "crates/boxkv-executor",
    "crates/boxkv-server",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["box<盒马> <2353151024@qq.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.11.0"
thiserror = "2.0.17"
tempfile = "3"
crossbeam-skiplist = "0.1.3"
uuid = { version = "1", features = ["v4", "v5", "serde"] }